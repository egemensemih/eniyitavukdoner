<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Denedik · Bütün bağlantılar</title>
<meta name="description" content="Denedik'in YouTube, Instagram ve TikTok hesapları tek yerde. Biz denedik, sen de izle.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Denedik">
<meta property="og:title" content="Denedik · Bütün bağlantılar">
<meta property="og:description" content="YouTube, Instagram ve TikTok hesaplarımız tek yerde.">
<meta property="og:locale" content="tr_TR">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#FAD700">
<link rel="icon" href="/denedik.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sari:#FAD700;--sari-a:#FFF480;--siyah:#0B0906;--gri:#4A4636;--f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;font-family:var(--f);color:var(--siyah);background:var(--sari);background-image:radial-gradient(circle at 20% 0,var(--sari-a) 0,transparent 50%);background-attachment:fixed;display:flex;justify-content:center;padding:max(32px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
.logo{width:150px;height:auto;filter:drop-shadow(0 10px 22px rgba(11,9,6,.18))}
.alt{margin-top:14px;font-size:15px;font-weight:500;color:var(--gri);text-align:center;line-height:1.5;max-width:330px}
.abone{margin-top:22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;min-height:58px;background:var(--siyah);color:#fff;font-weight:800;font-size:16.5px;padding:14px 24px;border-radius:999px;text-decoration:none;box-shadow:0 12px 26px rgba(11,9,6,.28);transition:transform .15s,box-shadow .15s}
.abone svg{width:28px;height:28px}
.abone:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(11,9,6,.34)}
.abone:focus-visible,a.bag:focus-visible,.paylas:focus-visible{outline:3px solid #fff;outline-offset:3px}
.abone-n{margin-top:8px;font-size:12.5px;font-weight:500;color:var(--gri)}
.bolum{width:100%;margin-top:28px}
.bolum h2{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--siyah);margin:0 0 10px 6px;opacity:.75}
.liste{display:flex;flex-direction:column;gap:10px}
a.bag{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 16px 10px 10px;background:#fff;border:2px solid var(--siyah);border-radius:18px;color:var(--siyah);text-decoration:none;box-shadow:4px 4px 0 var(--siyah);transition:transform .12s,box-shadow .12s}
a.bag:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--siyah)}
a.bag:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--siyah)}
.ik{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff}
.ik svg{width:24px;height:24px}
.yt{background:#E52D27}.ig{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF)}.tt{background:var(--siyah)}
.yz{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.yz b{font-size:15.5px;font-weight:800;line-height:1.3}
.yz small{font-size:13px;font-weight:500;color:var(--gri);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{flex:none;font-size:18px;font-weight:700;transition:transform .15s}
a.bag:hover .ok{transform:translateX(3px)}
.alt-satir{margin-top:32px;display:flex;flex-direction:column;align-items:center;gap:12px}
.paylas{font:700 14px var(--f);color:var(--siyah);background:transparent;border:2px solid var(--siyah);border-radius:999px;padding:10px 20px;cursor:pointer;min-height:44px}
.paylas:hover{background:var(--siyah);color:var(--sari)}
footer{font-size:12.5px;font-weight:500;color:var(--gri);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--siyah);color:var(--sari);font-size:14px;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <img class="logo" src="/denedik.svg" alt="Denedik" width="150" height="109">
  <p class="alt">Biz denedik, sen de izle. Yeni videolar, denemeler ve kamera arkası burada.</p>
  <a class="abone" href="https://www.youtube.com/@denedik?sub_confirmation=1" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4.5" fill="#E52D27"/><path d="M10 9v6l5-3z" fill="#fff"/></svg>YouTube'da abone ol</a>
  <p class="abone-n">Yeni videoları kaçırma · @denedik</p>

  <section class="bolum" aria-labelledby="h-takip">
    <h2 id="h-takip">Takip et</h2>
    <div class="liste">
      <a class="bag" href="https://www.youtube.com/@denedik" target="_blank" rel="noopener">
        <span class="ik yt" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 7.5v9l7.5-4.5z"/></svg></span>
        <span class="yz"><b>YouTube</b><small>@denedik</small></span><span class="ok" aria-hidden="true">→</span></a>
      <a class="bag" href="https://www.instagram.com/denedikco/" target="_blank" rel="noopener">
        <span class="ik ig" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6" fill="currentColor"/></svg></span>
        <span class="yz"><b>Instagram</b><small>@denedikco</small></span><span class="ok" aria-hidden="true">→</span></a>
      <!--TIKTOK-->
    </div>
  </section>

  <div class="alt-satir">
    <button type="button" class="paylas" id="paylas">Bu sayfayı paylaş</button>
    <footer>© 2026 Denedik</footer>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/denedik-social/paylas.js"></script>
</body>
</html>
