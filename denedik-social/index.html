<style>
/* Denedik kurumsal kimlik: sarı #f8d847 · siyah #000 · mavi #3152f7 · mor #562166 · kırmızı #c92f23 · yeşil #9fe58e
   Kurumsal font Söhne (lisanslı); web için en yakın açık muadil Inter Tight kullanılıyor. */
:root{--sari:#f8d847;--siyah:#000;--mavi:#3152f7;--mor:#562166;--kirmizi:#c92f23;--yesil:#9fe58e;--gri:#3d3517;--f:'Söhne','Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:var(--sari)}
body{min-height:100vh;min-height:100dvh;font-family:var(--f);color:var(--siyah);background:var(--sari);display:flex;flex-direction:column;align-items:center;overflow-x:clip}
main{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;padding:max(40px,env(safe-area-inset-top)) 16px 36px;flex:1}
.logo{width:184px;height:auto;color:var(--siyah);display:block}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.alt{margin-top:18px;font-size:16px;font-weight:500;line-height:1.45;text-align:center;max-width:320px;letter-spacing:-.005em}
.abone{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:62px;background:var(--siyah);color:#fff;font-weight:800;font-size:17px;letter-spacing:-.01em;padding:14px 22px;border:2.5px solid var(--siyah);border-radius:16px;text-decoration:none;box-shadow:6px 6px 0 var(--kirmizi);transition:transform .12s,box-shadow .12s}
.abone svg{width:30px;height:30px;flex:none}
.abone:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--kirmizi)}
.abone:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--kirmizi)}
.abone-n{margin-top:12px;font-size:13px;font-weight:500;color:var(--gri)}
.bolum{width:100%;margin-top:34px}
.bolum h2{font-size:24px;font-weight:900;font-style:italic;letter-spacing:-.02em;margin:0 0 14px 2px}
.liste{display:flex;flex-direction:column;gap:16px}
a.bag{--g:var(--siyah);display:flex;align-items:center;gap:14px;min-height:70px;padding:10px 18px 10px 11px;background:#fff;border:2.5px solid var(--siyah);border-radius:16px;color:var(--siyah);text-decoration:none;box-shadow:6px 6px 0 var(--g);transition:transform .12s,box-shadow .12s}
a.bag:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--g)}
a.bag:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--g)}
.ik{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--g)}
.ik svg{width:24px;height:24px}
a.yt{--g:var(--kirmizi)}a.ig{--g:var(--mor)}a.tt{--g:var(--mavi)}
.yz{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.yz b{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.yz small{font-size:14px;font-weight:500;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{flex:none;font-size:20px;font-weight:800;transition:transform .15s}
a.bag:hover .ok{transform:translateX(3px)}
.paylas{margin-top:36px;font:800 15px var(--f);color:var(--siyah);background:var(--yesil);border:2.5px solid var(--siyah);border-radius:999px;padding:11px 24px;min-height:48px;cursor:pointer;box-shadow:4px 4px 0 var(--siyah);transition:transform .12s,box-shadow .12s}
.paylas:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--siyah)}
.paylas:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--siyah)}
.abone:focus-visible,a.bag:focus-visible,.paylas:focus-visible{outline:3px solid var(--mavi);outline-offset:4px}
footer{margin-top:22px;font-size:13px;font-weight:500;color:var(--gri)}
.serit{width:100%;height:14px;display:flex;flex:none;margin-bottom:env(safe-area-inset-bottom)}
.serit i{flex:1}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:var(--siyah);color:var(--sari);font-size:14px;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
